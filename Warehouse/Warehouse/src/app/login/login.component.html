<div class="login-container">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email"
             type="email"
             class="form-control"
             formControlName="email"
             [class.is-invalid]="loginForm.get('email')?.invalid && (loginForm.get('email')?.touched || loginForm.get('email')?.dirty)" />
      <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['required']">
        Email is required.
      </div>
      <div class="invalid-feedback" *ngIf="loginForm.get('email')?.errors?.['email']">
        Please enter a valid email.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password"
             type="password"
             class="form-control"
             formControlName="password"
             [class.is-invalid]="loginForm.get('password')?.invalid && (loginForm.get('password')?.touched || loginForm.get('password')?.dirty)" />
      <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['required']">
        Password is required.
      </div>
      <div class="invalid-feedback" *ngIf="loginForm.get('password')?.errors?.['minlength']">
        Password must be at least 6 characters.
      </div>
    </div>

    <!-- Error Message -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Submit -->
    <button type="submit"
            class="btn btn-custom-red btn-sm"
            [disabled]="loginForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Logging in...' : 'Login' }}
    </button>
  </form>
</div>
