<div class="register-container">
  <h2 class="mb-4">Register</h2>

  <!-- Error Alert -->
  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name"
             type="text"
             class="form-control"
             formControlName="name"
             [class.is-invalid]="registerForm.get('name')?.invalid && (registerForm.get('name')?.touched || registerForm.get('name')?.dirty)" />
      <div class="invalid-feedback" *ngIf="registerForm.get('name')?.errors?.['required']">
        Name is required.
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email"
             type="email"
             class="form-control"
             formControlName="email"
             [class.is-invalid]="registerForm.get('email')?.invalid && (registerForm.get('email')?.touched || registerForm.get('email')?.dirty)" />
      <div class="invalid-feedback" *ngIf="registerForm.get('email')?.errors?.['required']">
        Email is required.
      </div>
      <div class="invalid-feedback" *ngIf="registerForm.get('email')?.errors?.['email']">
        Please enter a valid email address.
      </div>
    </div>

    <!-- Password -->
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input id="password"
             type="password"
             class="form-control"
             formControlName="password"
             [class.is-invalid]="registerForm.get('password')?.invalid && (registerForm.get('password')?.touched || registerForm.get('password')?.dirty)" />
      <div class="invalid-feedback" *ngIf="registerForm.get('password')?.errors?.['required']">
        Password is required.
      </div>
      <div class="invalid-feedback" *ngIf="registerForm.get('password')?.errors?.['minlength']">
        Password must be at least 6 characters long.
      </div>
    </div>

    <!-- Role -->
    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select id="role"
              class="form-select"
              formControlName="role"
              [class.is-invalid]="registerForm.get('role')?.invalid && (registerForm.get('role')?.touched || registerForm.get('role')?.dirty)">
        <option value="" disabled>Select a role</option>
        <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
      </select>
      <div class="invalid-feedback" *ngIf="registerForm.get('role')?.errors?.['required']">
        Role is required.
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit"
            class="btn btn-custom-red btn-sm"
            [disabled]="registerForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Registering...' : 'Register' }}
    </button>
  </form>
</div>
