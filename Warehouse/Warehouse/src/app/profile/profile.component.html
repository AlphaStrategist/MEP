<div class="profile-container">
  <h2>My Profile</h2>

  <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
  <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>

  <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <!-- Name -->
    <div class="mb-3">
      <label for="name" class="form-label">Name</label>
      <input id="name"
             type="text"
             class="form-control"
             formControlName="name"
             [class.is-invalid]="profileForm.get('name')?.invalid && (profileForm.get('name')?.touched || profileForm.get('name')?.dirty)" />
      <div class="invalid-feedback" *ngIf="profileForm.get('name')?.errors?.['required']">
        Name is required.
      </div>
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email"
             type="email"
             class="form-control"
             formControlName="email"
             [class.is-invalid]="profileForm.get('email')?.invalid && (profileForm.get('email')?.touched || profileForm.get('email')?.dirty)" />
      <div class="invalid-feedback" *ngIf="profileForm.get('email')?.errors?.['required']">
        Email is required.
      </div>
      <div class="invalid-feedback" *ngIf="profileForm.get('email')?.errors?.['email']">
        Please enter a valid email address.
      </div>
    </div>

    <button type="submit"
            class="btn btn-custom-red btn-sm"
            [disabled]="profileForm.invalid || isSubmitting">
      {{ isSubmitting ? 'Saving...' : 'Save Changes' }}
    </button>
  </form>
</div>
